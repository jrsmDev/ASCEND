<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    var l = s.lang || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'en');
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  } catch (e) {}
</script>
<title>ASCEND</title>
<meta name="description" content="ASCEND - Evolve Beyond Your Limits">
<meta name="theme-color" content="#090A09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ASCEND">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-180.png">
</head>
<body>
<!-- The boot screen: painted with the HTML, before any script runs.
     lib/boot.js takes it away the moment the app can draw. -->
<style>
  /* The first thing the app says. Painted before any script runs, so it stays useful on a cold
     cache: a theatrical but restrained reveal, then a thin line that fills while the app boots. */
  #boot{
    position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;overflow:hidden;
    background:
      radial-gradient(54% 42% at 50% 37%,rgba(199,244,90,.14),transparent 72%),
      radial-gradient(84% 62% at 50% 112%,rgba(168,217,47,.055),transparent 62%),
      #080A08;
    transition:opacity .38s cubic-bezier(.4,0,.2,1),visibility .38s;
  }
  #boot::before{
    content:'';position:absolute;inset:-12%;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);
    background-size:24px 24px;opacity:.28;
    -webkit-mask-image:radial-gradient(ellipse at center,#000 0%,transparent 68%);
    mask-image:radial-gradient(ellipse at center,#000 0%,transparent 68%);
  }
  #boot::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(124% 96% at 50% 44%,transparent 38%,rgba(0,0,0,.62) 100%)}
  #boot.out{opacity:0;visibility:hidden;pointer-events:none}
  #boot.out .boot-inner{opacity:0;transform:scale(1.035)}
  .boot-halo{
    position:absolute;width:min(76vw,580px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,rgba(199,244,90,.16),rgba(199,244,90,.035) 46%,transparent 68%);
    filter:blur(10px);animation:boot-halo 3.2s ease-in-out infinite;
  }
  .boot-inner{
    position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;
    padding:24px;transform-origin:center;
    transition:opacity .34s ease,transform .34s cubic-bezier(.4,0,.2,1);
  }
  .boot-logo{
    width:clamp(132px,31vw,168px);height:auto;
    filter:drop-shadow(0 24px 52px rgba(199,244,90,.18));
  }
  .boot-mark{animation:boot-mark 1.05s cubic-bezier(.16,1,.3,1) both;transform-box:fill-box;transform-origin:center}
  .boot-word{animation:boot-word 1.1s .22s cubic-bezier(.16,1,.3,1) both;transform-box:fill-box;transform-origin:center}
  .boot-sub{
    margin-top:22px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:9.5px;font-weight:500;letter-spacing:.32em;color:rgba(255,255,255,.54);
    text-transform:uppercase;animation:boot-sub .9s .58s cubic-bezier(.16,1,.3,1) both;
  }
  .boot-progress{
    width:86px;height:1px;margin-top:26px;overflow:hidden;border-radius:99px;
    background:rgba(255,255,255,.10);
  }
  .boot-progress span{
    display:block;width:100%;height:100%;transform-origin:left;transform:scaleX(0);
    background:linear-gradient(90deg,#A8D92F,#C7F45A);
    box-shadow:0 0 12px rgba(199,244,90,.55);
    animation:boot-fill 1.32s .18s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes boot-mark{0%{opacity:0;transform:scale(.82) translateY(10px)}100%{opacity:1;transform:none}}
  @keyframes boot-word{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
  @keyframes boot-sub{0%{opacity:0;transform:translateY(7px);letter-spacing:.23em}100%{opacity:1;transform:none;letter-spacing:.32em}}
  @keyframes boot-halo{0%,100%{opacity:.66;transform:scale(.95)}50%{opacity:1;transform:scale(1.045)}}
  @keyframes boot-fill{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){
    .boot-halo,.boot-mark,.boot-word,.boot-sub,.boot-progress span{animation:none!important;opacity:1;transform:none}
    #boot,#boot .boot-inner{transition:none}
  }
</style>
<div id="boot" aria-hidden="true">
  <div class="boot-halo"></div>
  <div class="boot-inner">
    <svg class="boot-logo" viewBox="-40 -20 276 290" focusable="false" role="presentation">
      <g class="boot-mark" fill="#C7F45A">
        <polygon points="6,194 100,4 112,30 52,194"/>
        <polygon points="137.6,80 194,194 150,194 121.8,137"/>
        <polygon points="100,96 127,164 109,164 100,141 91,164 73,164"/>
      </g>
      <g class="boot-word">
        <g transform="translate(-40 232)" fill="#F5F7F2">
          <polygon points="0,32 10.5,0 15.5,0 26,32 20,32 13,8 6,32"/>
          <g fill="none" stroke="#F5F7F2" stroke-width="6">
            <path transform="translate(50 0)" d="M26 3 H3 V16 H23 V29 H0"/>
            <path transform="translate(100 0)" d="M26 3 H3 V29 H26"/>
            <path transform="translate(150 0)" d="M26 3 H3 V29 H26 M3 16 H22"/>
            <path transform="translate(200 0)" d="M3 0 V32 M23 0 V32 M3 4 L23 28"/>
            <path transform="translate(250 0)" d="M3 32 V3 H15 L23 11 V21 L15 29 H0"/>
          </g>
        </g>
      </g>
    </svg>
    <div class="boot-sub">Evolve Beyond Your Limits</div>
    <div class="boot-progress"><span></span></div>
  </div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
